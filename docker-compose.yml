# You can add server-side setting whatever you want according to the
# proper operation server side environment.
#
networks:
  mblt_int:
    external: true

services:
  aries_vision_vlm_frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile

    hostname: aries-vision-vlm-frontend

    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
      - next:/app/.next

    ports:
      - 3000:3000

    networks:
      - mblt_int

  aries_vision_vlm_backend_vlm_weapon:
    build:
      context: ./backend_vlm
      dockerfile: backend.Dockerfile

    image: aries-vision-vlm-backend-vlm:latest

    hostname: aries-vision-vlm-backend-vlm-weapon

    privileged: true

    environment:
      - HF_HUB_OFFLINE=1
      - NPU_PRODUCT_LABEL=${NPU_PRODUCT_LABEL:-MLA100}
      - NPU_PER_CARD=${NPU_PER_CARD:-1}

    volumes:
      - ./backend_vlm/src:/src
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - /dev:/dev
      - ./core_allocation.yaml:/etc/aries/core_allocation.yaml:ro

    ports:
      - 5000:5000

    command: ["python", "src/server.py", "--category", "weapon", "--port", "5000"]

    networks:
      - mblt_int

  aries_vision_vlm_backend_vlm_fall:
    build:
      context: ./backend_vlm
      dockerfile: backend.Dockerfile

    image: aries-vision-vlm-backend-vlm:latest

    hostname: aries-vision-vlm-backend-vlm-fall

    privileged: true

    environment:
      - HF_HUB_OFFLINE=1
      - NPU_PRODUCT_LABEL=${NPU_PRODUCT_LABEL:-MLA100}
      - NPU_PER_CARD=${NPU_PER_CARD:-1}

    volumes:
      - ./backend_vlm/src:/src
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - /dev:/dev
      - ./core_allocation.yaml:/etc/aries/core_allocation.yaml:ro

    ports:
      - 5001:5001

    command: ["python", "src/server.py", "--category", "fall", "--port", "5001"]

    depends_on:
      - aries_vision_vlm_backend_vlm_weapon

    networks:
      - mblt_int

  aries_vision_vlm_backend_vision:
    build:
      context: ./backend_vision
      dockerfile: vision.Dockerfile

    hostname: aries-vision-vlm-backend-vision

    privileged: true

    volumes:
      - ./backend_vision/assets:/workspace/assets:ro
      - /dev:/dev
      - ./core_allocation.yaml:/etc/aries/core_allocation.yaml:ro

    ports:
      - 8081:8081

    networks:
      - mblt_int

volumes:
  node_modules:
  next:
