image_layout:
  - path: ../assets/layout/black.png
    roi: [0, 0, 1292, 1468]

worker_layout:
  # 32-channel grid: 4 cols x 8 rows, cell 320x180, gap 4px.
  # Cols 0-1 (feeders 0-15) run weapon detection (model_index 0), each feeder
  # unique. Cols 2-3 (feeders 16-23) run fall detection (model_index 1); only
  # 8 unique fall clips exist, so rows 4-7 fan out feeders 16-23 to the second
  # half of the grid (one MatBuffer per feeder feeds multiple workers).
  # Col starts: 0, 324, 648, 972. Row starts: 0, 184, 368, 552, 736, 920, 1104, 1288.

  # Row 0
  - {feeder_index: 0,  model_index: 0, roi: [0,   0,   320, 180]}
  - {feeder_index: 1,  model_index: 0, roi: [324, 0,   320, 180]}
  - {feeder_index: 16, model_index: 1, roi: [648, 0,   320, 180]}
  - {feeder_index: 17, model_index: 1, roi: [972, 0,   320, 180]}

  # Row 1
  - {feeder_index: 2,  model_index: 0, roi: [0,   184, 320, 180]}
  - {feeder_index: 3,  model_index: 0, roi: [324, 184, 320, 180]}
  - {feeder_index: 18, model_index: 1, roi: [648, 184, 320, 180]}
  - {feeder_index: 19, model_index: 1, roi: [972, 184, 320, 180]}

  # Row 2
  - {feeder_index: 4,  model_index: 0, roi: [0,   368, 320, 180]}
  - {feeder_index: 5,  model_index: 0, roi: [324, 368, 320, 180]}
  - {feeder_index: 20, model_index: 1, roi: [648, 368, 320, 180]}
  - {feeder_index: 21, model_index: 1, roi: [972, 368, 320, 180]}

  # Row 3
  - {feeder_index: 6,  model_index: 0, roi: [0,   552, 320, 180]}
  - {feeder_index: 7,  model_index: 0, roi: [324, 552, 320, 180]}
  - {feeder_index: 22, model_index: 1, roi: [648, 552, 320, 180]}
  - {feeder_index: 23, model_index: 1, roi: [972, 552, 320, 180]}

  # Row 4 (fall feeders 16, 17 re-used)
  - {feeder_index: 8,  model_index: 0, roi: [0,   736, 320, 180]}
  - {feeder_index: 9,  model_index: 0, roi: [324, 736, 320, 180]}
  - {feeder_index: 16, model_index: 1, roi: [648, 736, 320, 180]}
  - {feeder_index: 17, model_index: 1, roi: [972, 736, 320, 180]}

  # Row 5 (fall feeders 18, 19 re-used)
  - {feeder_index: 10, model_index: 0, roi: [0,   920, 320, 180]}
  - {feeder_index: 11, model_index: 0, roi: [324, 920, 320, 180]}
  - {feeder_index: 18, model_index: 1, roi: [648, 920, 320, 180]}
  - {feeder_index: 19, model_index: 1, roi: [972, 920, 320, 180]}

  # Row 6 (fall feeders 20, 21 re-used)
  - {feeder_index: 12, model_index: 0, roi: [0,   1104, 320, 180]}
  - {feeder_index: 13, model_index: 0, roi: [324, 1104, 320, 180]}
  - {feeder_index: 20, model_index: 1, roi: [648, 1104, 320, 180]}
  - {feeder_index: 21, model_index: 1, roi: [972, 1104, 320, 180]}

  # Row 7 (fall feeders 22, 23 re-used)
  - {feeder_index: 14, model_index: 0, roi: [0,   1288, 320, 180]}
  - {feeder_index: 15, model_index: 0, roi: [324, 1288, 320, 180]}
  - {feeder_index: 22, model_index: 1, roi: [648, 1288, 320, 180]}
  - {feeder_index: 23, model_index: 1, roi: [972, 1288, 320, 180]}
