# 8 feeders. Even indices (0/2/4/6) drive left-column weapon channels;
# odd indices (1/3/5/7) drive right-column fall channels. Weapon feeders
# alternate positive/negative videos so multiple channels show detections.

# feeder 0 -> weapon (positive)
- feeder_type: VIDEO
  src_path: ../assets/video/positive/1.mp4
# feeder 1 -> fall
- feeder_type: VIDEO
  src_path: ../assets/fall/video/clip_0000.mp4
# feeder 2 -> weapon (negative)
- feeder_type: VIDEO
  src_path: ../assets/video/negative/2.mp4
# feeder 3 -> fall
- feeder_type: VIDEO
  src_path: ../assets/fall/video/clip_0016.mp4
# feeder 4 -> weapon (positive)
- feeder_type: VIDEO
  src_path: ../assets/video/positive/3.mp4
# feeder 5 -> fall
- feeder_type: VIDEO
  src_path: ../assets/fall/video/clip_0042.mp4
# feeder 6 -> weapon (negative)
- feeder_type: VIDEO
  src_path: ../assets/video/negative/6.mp4
# feeder 7 -> fall
- feeder_type: VIDEO
  src_path: ../assets/fall/video/clip_0023.mp4
