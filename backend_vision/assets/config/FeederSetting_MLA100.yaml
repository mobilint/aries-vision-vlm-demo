# 24 feeders. 0-15 drive the 16 weapon channels (each source is unique,
# positive/negative interleaved). 16-23 drive the 8 unique fall clips.
# The 16 fall worker cells in LayoutSetting reference feeders 16-23 twice
# rather than opening the same mp4 twice - one feeder can fan out to
# multiple workers via the shared MatBuffer.

